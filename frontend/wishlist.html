<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Wishlist – Hari Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .wishlist-page { padding: 48px 0 100px; }
    .page-header {
      margin-bottom: 40px;
    }
    .page-header h1 {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 500;
      color: var(--charcoal);
    }
    .wishlist-count {
      font-size: .9rem;
      color: var(--midtone);
      margin-top: 4px;
    }

    .wishlist-empty {
      text-align: center;
      padding: 100px 20px;
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .wishlist-empty h2 {
      font-family: var(--font-display);
      font-size: 1.8rem;
      margin-bottom: 12px;
      color: var(--charcoal);
    }
    .wishlist-empty p {
      color: var(--midtone);
      margin-bottom: 24px;
    }

    .wishlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }
  </style>
</head>
<body class="wishlist-page">

<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="nav-logo">Hari</a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/products.html">Products</a></li>
      <li id="nav-login"><a href="/login.html">Login</a></li>
      <li id="nav-signup"><a href="/signup.html" class="btn-primary">Sign Up</a></li>
      <li id="nav-logout" style="display:none"><a href="#" id="logout-btn">Logout</a></li>
    </ul>
    <div class="nav-icons">
      <button class="nav-icon-btn" onclick="openCartDrawer()">🛒
        <span class="icon-badge" id="cart-badge" style="display:none">0</span>
      </button>
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙</button>
      <button class="nav-hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</nav>

<div class="container">
  <div class="page-header fade-in-up">
    <h1>My Wishlist</h1>
    <p class="wishlist-count" id="wishlist-count">0 items</p>
  </div>

  <div id="wishlist-grid" class="wishlist-grid">
    <!-- Filled by JS -->
  </div>

  <div id="wishlist-empty" class="wishlist-empty" style="display:none;">
    <div style="font-size:4rem;margin-bottom:16px;">🤍</div>
    <h2>Your wishlist is empty</h2>
    <p>Save items you love to keep track of them.</p>
    <a href="/products.html" class="btn btn-primary">Start Shopping</a>
  </div>
</div>

<!-- ── Cart Drawer ────────────────────────────────────────────── -->
<div class="cart-overlay" id="cart-overlay" onclick="closeCartDrawer()"></div>
<div class="cart-drawer" id="cart-drawer">
  <div class="cart-header">
    <h3>Your Cart <span class="cart-count" id="cart-count">(0)</span></h3>
    <button class="cart-close" onclick="closeCartDrawer()">✕</button>
  </div>
  <div class="cart-body" id="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-subtotal"><span>Subtotal</span><span id="cart-total">₹0</span></div>
    <div class="cart-total"><span>Total</span><span id="cart-total-bold">₹0</span></div>
    <button id="checkout-btn" class="checkout-btn" onclick="alert('Checkout coming soon!')">
      Proceed to Checkout
    </button>
  </div>
</div>

<!-- ── Lightbox ────────────────────────────────────────────────── -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="Full size" />
</div>

<!-- ── Mobile Bottom Navigation ────────────────────────────────── -->
<div class="mobile-bottom-nav" id="mobile-nav" style="display:none;">
  <a href="/" class="bottom-nav-item">
    <span>🏠</span> Home
  </a>
  <a href="/products.html" class="bottom-nav-item">
    <span>🛍️</span> Shop
  </a>
  <a href="javascript:void(0)" onclick="openCartDrawer()" class="bottom-nav-item">
    <span>🛒</span> Cart
    <span class="icon-badge" id="mobile-cart-badge" style="display:none;position:absolute;top:-4px;right:8px;font-size:.65rem;">0</span>
  </a>
  <a href="/wishlist.html" class="bottom-nav-item active">
    <span>❤️</span> Wishlist
  </a>
  <a href="javascript:void(0)" onclick="openAccountMenu()" class="bottom-nav-item">
    <span>👤</span> Account
  </a>
</div>

<div id="toast"></div>

<script src="/js/shared.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  renderWishlistPage();
  updateWishlistPageBadges();

  if (window.innerWidth <= 768) {
    document.getElementById('mobile-nav').style.display = 'flex';
  }
});

function renderWishlistPage() {
  const grid = document.getElementById('wishlist-grid');
  const empty = document.getElementById('wishlist-empty');
  const countEl = document.getElementById('wishlist-count');
  const items = getWishlist();

  countEl.textContent = `${items.length} item${items.length !== 1 ? 's' : ''}`;

  if (items.length === 0) {
    grid.style.display = 'none';
    empty.style.display = 'block';
    return;
  }

  grid.style.display = 'grid';
  empty.style.display = 'none';

  grid.innerHTML = items.map(item => {
    const safeItem = encodeURIComponent(JSON.stringify({
      _id: item.id,
      name: item.name,
      price: item.price,
      imageUrl: item.image,
      category: item.category
    }));

    return `
      <div class="product-card fade-in-up">
        <div class="product-card-img">
          <img src="${item.image}" alt="${item.name}" loading="lazy" onclick="openLightbox('${item.image}')" />
          <button class="wishlist-btn active"
                  data-id="${item.id}"
                  onclick="removeFromWishlist('${item.id}')"
                  style="position:absolute;top:14px;right:14px;width:36px;height:36px;background:rgba(255,255,255,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--charcoal);cursor:pointer;">❤️</button>
        </div>
        <div class="product-card-body">
          <p class="product-card-category">${item.category}</p>
          <h3 class="product-card-name">${item.name}</h3>
          <div class="product-card-footer">
            <span class="product-price">${formatPrice(item.price)}</span>
            <button class="btn btn-primary btn-sm" onclick="addWishlistItemToCart('${safeItem}')">Add to Cart</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function addWishlistItemToCart(encodedItem) {
  const product = JSON.parse(decodeURIComponent(encodedItem));
  addToCart(product, 1);
  updateWishlistPageBadges();
}

function removeFromWishlist(id) {
  const list = getWishlist().filter(i => i.id !== id);
  setWishlist(list);
  showToast('Removed from wishlist', 'info');
  renderWishlistPage();
  updateWishlistPageBadges();
}

function updateWishlistPageBadges() {
  const count = getCartCount();

  const badge = document.getElementById('cart-badge');
  const mobileBadge = document.getElementById('mobile-cart-badge');
  const cartCount = document.getElementById('cart-count');

  if (badge) {
    badge.textContent = count;
    badge.style.display = count > 0 ? 'block' : 'none';
  }

  if (mobileBadge) {
    mobileBadge.textContent = count;
    mobileBadge.style.display = count > 0 ? 'block' : 'none';
  }

  if (cartCount) {
    cartCount.textContent = `(${count})`;
  }
}

const originalSetCartWishlistPage = setCart;
setCart = function(items) {
  originalSetCartWishlistPage(items);
  updateWishlistPageBadges();
};

function openAccountMenu() {
  const user = getUser();
  if (user) {
    if (user.role === 'admin') window.location.href = '/admin.html';
    else window.location.href = '/';
  } else {
    window.location.href = '/login.html';
  }
}
</script>
</body>
</html>
