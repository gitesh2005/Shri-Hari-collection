<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist – Hari</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="nav-logo">Hari</a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/products.html">Products</a></li>
      <li id="nav-login"><a href="/login.html">Login</a></li>
      <li id="nav-signup"><a href="/signup.html" class="btn-primary">Sign Up</a></li>
      <li id="nav-logout" style="display:none"><a href="#" id="logout-btn">Logout</a></li>
    </ul>
    <button class="nav-hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
 </nav>

 <!-- Cart Drawer (reuse) -->
 <div id="cart-overlay" onclick="closeCartDrawer()" style="position:fixed;inset:0;background:rgba(44,36,22,.5);z-index:2999;opacity:0;pointer-events:none;transition:opacity .3s ease;"></div>
 <div id="cart-drawer" style="position:fixed;top:0;right:0;bottom:0;width:380px;background:var(--white);box-shadow:-10px 0 40px rgba(0,0,0,.15);z-index:3000;transform:translateX(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;">
   <div class="cart-header" style="padding:20px;border-bottom:1px solid var(--warm-off);display:flex;align-items:center;justify-content:space-between;">
     <h3 style="font-family:var(--font-display);font-size:1.3rem;margin:0;">Cart <span id="cart-count">(0)</span></h3>
     <button onclick="closeCartDrawer()" style="width:36px;height:36px;border-radius:50%;background:var(--warm-off);border:none;font-size:1.1rem;cursor:pointer;">✕</button>
   </div>
   <div id="cart-items" style="flex:1;overflow-y:auto;padding:16px;"></div>
   <div style="padding:16px;border-top:1px solid var(--warm-off);background:var(--warm-off);">
     <div style="display:flex;justify-content:space-between;margin-bottom:12px;font-size:.9rem;"><span>Total:</span><strong id="cart-total" style="font-size:1.1rem;color:var(--copper);">₹0</strong></div>
     <button id="checkout-btn" onclick="alert('Checkout coming soon!')" style="width:100%;padding:12px;background:var(--charcoal);color:var(--cream);border:none;border-radius:var(--radius-sm);font-size:.95rem;font-weight:600;cursor:pointer;">Proceed to Checkout</button>
   </div>
 </div>

 <!-- Theme Toggle -->
 <div style="position:fixed;top:20px;right:20px;z-index:9999;">
   <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" style="width:40px;height:40px;border-radius:50%;background:var(--warm-off);border:none;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;">🌙</button>
 </div>

<div class="container" style="padding:48px 0;">
  <h1 style="font-family:var(--font-display);font-size:2.2rem;margin-bottom:8px;">My Wishlist</h1>
  <p id="wishlist-count" style="color:var(--midtone);margin-bottom:32px;">0 items</p>

  <div id="wishlist-grid" class="products-grid"></div>

  <div id="wishlist-empty" class="empty-state" style="display:none;padding:80px 20px;">
    <h3>Your wishlist is empty</h3>
    <p style="color:var(--midtone);margin-bottom:24px;">Save items you love to keep track of them.</p>
    <a href="/products.html" class="btn btn-primary">Start Shopping</a>
  </div>
</div>

<!-- Cart Drawer -->
<div id="cart-overlay" onclick="closeCartDrawer()" style="position:fixed;inset:0;background:rgba(44,36,22,.5);z-index:2999;opacity:0;pointer-events:none;transition:opacity .3s ease;"></div>
<div id="cart-drawer" style="position:fixed;top:0;right:0;bottom:0;width:380px;background:var(--white);box-shadow:-10px 0 40px rgba(0,0,0,.15);z-index:3000;transform:translateX(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;">
  <div class="cart-header" style="padding:20px;border-bottom:1px solid var(--warm-off);display:flex;align-items:center;justify-content:space-between;">
    <h3 style="font-family:var(--font-display);font-size:1.3rem;margin:0;">Cart <span id="cart-count">(0)</span></h3>
    <button onclick="closeCartDrawer()" style="width:36px;height:36px;border-radius:50%;background:var(--warm-off);border:none;font-size:1.1rem;cursor:pointer;">✕</button>
  </div>
  <div id="cart-items" style="flex:1;overflow-y:auto;padding:16px;"></div>
  <div style="padding:16px;border-top:1px solid var(--warm-off);background:var(--warm-off);">
    <div style="display:flex;justify-content:space-between;margin-bottom:12px;font-size:.9rem;"><span>Total:</span><strong id="cart-total" style="font-size:1.1rem;color:var(--copper);">₹0</strong></div>
    <button id="checkout-btn" onclick="alert('Checkout coming soon!')" style="width:100%;padding:12px;background:var(--charcoal);color:var(--cream);border:none;border-radius:var(--radius-sm);font-size:.95rem;font-weight:600;cursor:pointer;">Proceed to Checkout</button>
  </div>
</div>

<div id="toast"></div>

<script src="/js/shared.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  renderWishlist();
});

function renderWishlistPage() {
  const grid = document.getElementById('wishlist-grid');
  const empty = document.getElementById('wishlist-empty');
  const countEl = document.getElementById('wishlist-count');
  const items = getWishlist();
  countEl.textContent = `${items.length} item${items.length !== 1 ? 's' : ''}`;
  if (items.length === 0) {
    grid.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  grid.style.display = 'grid';
  empty.style.display = 'none';
  grid.innerHTML = items.map(item => `
    <div class="product-card fade-in-up">
      <div class="product-card-img">
        <img src="${item.image}" alt="${item.name}" loading="lazy" onclick="openLightbox('${item.image}')" />
        <button class="wishlist-btn active" data-id="${item.id}" onclick="removeFromWishlist('${item.id}')" style="position:absolute;top:14px;right:14px;width:36px;height:36px;background:rgba(255,255,255,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--charcoal);cursor:pointer;">❤️</button>
      </div>
      <div class="product-card-body">
        <p class="product-card-category">${item.category}</p>
        <h3 class="product-card-name">${item.name}</h3>
        <div class="product-card-footer">
          <span class="product-price">${formatPrice(item.price)}</span>
          <button class="btn btn-primary btn-sm" onclick='addToCart(${JSON.stringify(item).replace(/"/g, '&quot;')}, 1)'>Add to Cart</button>
        </div>
      </div>
    </div>
  `).join('');
}

function removeFromWishlist(id) {
  const list = getWishlist().filter(i => i.id !== id);
  setWishlist(list);
  showToast('Removed from wishlist', 'info');
  renderWishlistPage();
}
</script>
</body>
</html>
