<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products – Hari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/css/style.css" />

  <!-- ✅ ZOOM CSS ADDED -->
  <style>
    .product-card-img img {
      cursor: zoom-in;
    }

    .product-card-img .zoom-hint {
      position: absolute;
      bottom: 10px; right: 10px;
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(44,36,22,.65);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: .9rem;
      opacity: 0;
      transform: scale(.8);
      transition: .2s;
      pointer-events: none;
    }

    .product-card:hover .zoom-hint {
      opacity: 1;
      transform: scale(1);
    }

    #lightbox {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.9);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: .3s;
      z-index: 2000;
    }

    #lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    #lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }

    #lightbox button {
      position: absolute;
      top: 20px; right: 20px;
      background: #fff;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- ── Navbar ─────────────────────────────────────────────────── -->
<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="nav-logo">Hari</a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/products.html" class="active">Products</a></li>
      <li id="nav-admin" style="display:none"><a href="/admin.html">Dashboard</a></li>
      <li id="nav-login"><a href="/login.html">Login</a></li>
      <li id="nav-signup"><a href="/signup.html" class="btn-primary">Sign Up</a></li>
      <li id="nav-logout" style="display:none">
        <a href="#" id="logout-btn">Logout</a>
      </li>
    </ul>
    <button class="nav-hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- ── Page Banner ────────────────────────────────────────────── -->
<div class="page-banner">
  <div class="container">
    <h1>Our <em style="color:var(--copper);font-style:italic;">Collection</em></h1>
    <p>Handpicked ethnic wear for every occasion</p>
  </div>
</div>

<!-- ── Products Section ───────────────────────────────────────── -->
<section class="section">
  <div class="container">

    <div class="filter-bar">
      <button class="filter-btn active" data-cat="">All</button>
      <button class="filter-btn" data-cat="Kurti">Kurtis</button>
      <button class="filter-btn" data-cat="Suits">Suits</button>

      <div class="search-bar">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
        </svg>
        <input type="search" id="search-input" placeholder="Search products…" />
      </div>

      <select id="sort-select"
        style="padding:10px 14px;border:1.5px solid var(--sand);border-radius:30px;
               background:var(--white);font-size:.87rem;color:var(--charcoal);outline:none;cursor:pointer;">
        <option value="newest">Newest First</option>
        <option value="price-asc">Price: Low → High</option>
        <option value="price-desc">Price: High → Low</option>
      </select>
    </div>

    <p id="result-count" style="font-size:.87rem;color:var(--midtone);margin-bottom:24px;"></p>

    <div id="products-grid" class="products-grid"></div>

    <div id="pagination" style="display:flex;justify-content:center;gap:10px;margin-top:48px;flex-wrap:wrap;"></div>
  </div>
</section>

<footer>
  <div class="footer-inner">
    <div class="footer-logo">Hari</div>
    <ul class="footer-links">
      <li><a href="/">Home</a></li>
      <li><a href="/products.html">Products</a></li>
      <li><a href="/login.html">Login</a></li>
    </ul>
  </div>
  <div class="footer-bottom">
    <p>© 2026 Hari. All rights reserved.</p>
  </div>
</footer>

<!-- ✅ LIGHTBOX HTML -->
<div id="lightbox">
  <button onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" />
</div>

<div id="toast"></div>

<script src="/js/shared.js"></script>
<script>
  let currentPage = 1;
  let currentCategory = '';
  let currentSearch = '';
  let currentSort = 'newest';
  const LIMIT = 12;

  async function loadProducts() {
    const grid = document.getElementById('products-grid');
    grid.innerHTML = skeletonCards(LIMIT);

    try {
      const data = await apiFetch(`/products?page=${currentPage}&limit=${LIMIT}`);
      let products = data.data || [];

      grid.innerHTML = products.map(p => `
        <div class="product-card fade-in-up">
          <div class="product-card-img">
            <!-- ✅ ZOOM CLICK ADDED -->
            <img src="${p.imageUrl}" alt="${p.name}" loading="lazy"
                 onclick="openLightbox('${p.imageUrl}')" />
            <span class="product-badge">${p.category}</span>
            <div class="zoom-hint">🔍</div>
          </div>

          <div class="product-card-body">
            <p class="product-card-category">${p.category}</p>
            <h3 class="product-card-name">${p.name}</h3>
            <p class="product-card-desc">${p.description}</p>
            <div class="product-card-footer">
              <span class="product-price">${formatPrice(p.price)}</span>
              <button class="btn btn-primary btn-sm">Add to Cart</button>
            </div>
          </div>
        </div>
      `).join('');

    } catch (err) {
      grid.innerHTML = `<h3>Error loading products</h3>`;
    }
  }

  /* ✅ LIGHTBOX JS */
  function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('open');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
  }

  loadProducts();
</script>

</body>
</html>
