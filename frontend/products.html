<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products – Hari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/css/style.css" />

  <!-- ✅ ZOOM CSS ADDED -->
  <style>
    .product-card-img img {
      cursor: zoom-in;
    }

    .product-card-img .zoom-hint {
      position: absolute;
      bottom: 10px; right: 10px;
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(44,36,22,.65);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: .9rem;
      opacity: 0;
      transform: scale(.8);
      transition: .2s;
      pointer-events: none;
    }

    .product-card:hover .zoom-hint {
      opacity: 1;
      transform: scale(1);
    }

    #lightbox {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.9);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: .3s;
      z-index: 2000;
    }

    #lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    #lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }

    #lightbox button {
      position: absolute;
      top: 20px; right: 20px;
      background: #fff;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- ── Navbar ─────────────────────────────────────────────────── -->
<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="nav-logo">Hari</a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/products.html" class="active">Products</a></li>
      <li id="nav-admin" style="display:none"><a href="/admin.html">Dashboard</a></li>
      <li id="nav-login"><a href="/login.html">Login</a></li>
      <li id="nav-signup"><a href="/signup.html" class="btn-primary">Sign Up</a></li>
      <li id="nav-logout" style="display:none">
        <a href="#" id="logout-btn">Logout</a>
      </li>
     </ul>

     <!-- Icons -->
     <div style="display:flex;align-items:center;gap:16px;">
       <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme" style="
         width:40px;height:40px;border-radius:50%;background:var(--warm-off);border:none;
         font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
         transition:all .3s ease;
       ">🌙</button>

       <button onclick="openCartDrawer()" aria-label="Cart" style="
         position:relative;background:none;border:none;font-size:1.3rem;cursor:pointer;
       ">🛒
         <span class="icon-badge" id="cart-badge" style="
           position:absolute;top:-4px;right:-6px;background:var(--rust);color:white;
           font-size:.65rem;padding:2px 6px;border-radius:10px;min-width:16px;text-align:center;
           display:none;
         ">0</span>
       </button>

       <button class="nav-hamburger" aria-label="Menu">
         <span></span><span></span><span></span>
       </button>
     </div>
   </div>
 </nav>

<!-- ── Page Banner ────────────────────────────────────────────── -->
<div class="page-banner">
  <div class="container">
    <h1>Our <em style="color:var(--copper);font-style:italic;">Collection</em></h1>
    <p>Handpicked ethnic wear for every occasion</p>
  </div>
</div>

<!-- ── Products Section ───────────────────────────────────────── -->
<section class="section">
  <div class="container">

    <div class="filter-bar">
      <button class="filter-btn active" data-cat="">All</button>
      <button class="filter-btn" data-cat="Kurti">Kurtis</button>
      <button class="filter-btn" data-cat="Suits">Suits</button>

      <div class="search-bar">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
        </svg>
        <input type="search" id="search-input" placeholder="Search products…" />
      </div>

      <select id="sort-select"
        style="padding:10px 14px;border:1.5px solid var(--sand);border-radius:30px;
               background:var(--white);font-size:.87rem;color:var(--charcoal);outline:none;cursor:pointer;">
        <option value="newest">Newest First</option>
        <option value="price-asc">Price: Low → High</option>
        <option value="price-desc">Price: High → Low</option>
      </select>
    </div>

    <p id="result-count" style="font-size:.87rem;color:var(--midtone);margin-bottom:24px;"></p>

    <div id="products-grid" class="products-grid"></div>

    <div id="pagination" style="display:flex;justify-content:center;gap:10px;margin-top:48px;flex-wrap:wrap;"></div>
  </div>
</section>

<footer>
  <div class="footer-inner">
    <div class="footer-logo">Hari</div>
    <ul class="footer-links">
      <li><a href="/">Home</a></li>
      <li><a href="/products.html">Products</a></li>
      <li><a href="/login.html">Login</a></li>
    </ul>
  </div>
  <div class="footer-bottom">
    <p>© 2026 Hari. All rights reserved.</p>
  </div>
  </footer>

  <!-- Cart Drawer -->
  <div id="cart-overlay" onclick="closeCartDrawer()" style="
    position:fixed;inset:0;background:rgba(44,36,22,.5);z-index:2999;
    opacity:0;pointer-events:none;transition:opacity .3s ease;
  "></div>
  <div id="cart-drawer" style="
    position:fixed;top:0;right:0;bottom:0;width:380px;background:var(--white);
    box-shadow:-10px 0 40px rgba(0,0,0,.15);z-index:3000;
    transform:translateX(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;
  ">
    <div class="cart-header" style="padding:20px;border-bottom:1px solid var(--warm-off);display:flex;align-items:center;justify-content:space-between;">
      <h3 style="font-family:var(--font-display);font-size:1.3rem;margin:0;">Cart <span id="cart-count">(0)</span></h3>
      <button onclick="closeCartDrawer()" style="width:36px;height:36px;border-radius:50%;background:var(--warm-off);border:none;font-size:1.1rem;cursor:pointer;">✕</button>
    </div>
    <div id="cart-items" style="flex:1;overflow-y:auto;padding:16px;"></div>
    <div style="padding:16px;border-top:1px solid var(--warm-off);background:var(--warm-off);">
      <div style="display:flex;justify-content:space-between;margin-bottom:12px;font-size:.9rem;">
        <span>Total:</span>
        <strong id="cart-total" style="font-size:1.1rem;color:var(--copper);">₹0</strong>
      </div>
      <button id="checkout-btn" onclick="alert('Checkout coming soon!')" style="
        width:100%;padding:12px;background:var(--charcoal);color:var(--cream);
        border:none;border-radius:var(--radius-sm);font-size:.95rem;font-weight:600;
        cursor:pointer;transition:background .3s ease;
      ">Proceed to Checkout</button>
    </div>
  </div>

  <!-- Mobile Bottom Nav -->
  <div class="mobile-bottom-nav" style="display:none;">
    <a href="/" class="bottom-nav-item" style="display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75rem;color:var(--midtone);text-decoration:none;padding:6px 16px;">
      <span style="font-size:1.4rem;">🏠</span>Home
    </a>
    <a href="/products.html" class="bottom-nav-item active" style="display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75rem;color:var(--copper);text-decoration:none;padding:6px 16px;">
      <span style="font-size:1.4rem;">🛍️</span>Shop
    </a>
    <a href="javascript:void(0)" onclick="openCartDrawer()" style="display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75rem;color:var(--midtone);text-decoration:none;padding:6px 16px;position:relative;">
      <span style="font-size:1.4rem;">🛒</span>Cart
      <span id="mobile-cart-badge" style="position:absolute;top:-4px;right:8px;background:var(--rust);color:white;font-size:.65rem;padding:2px 6px;border-radius:10px;display:none;">0</span>
    </a>
    <a href="/wishlist.html" class="bottom-nav-item" style="display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75rem;color:var(--midtone);text-decoration:none;padding:6px 16px;">
      <span style="font-size:1.4rem;">❤️</span>Wishlist
    </a>
    <a href="/login.html" class="bottom-nav-item" style="display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75rem;color:var(--midtone);text-decoration:none;padding:6px 16px;">
      <span style="font-size:1.4rem;">👤</span>Account
    </a>
  </div>

  <style>
    @media (max-width: 768px) {
      .mobile-bottom-nav { display: flex !important; }
    }
  </style>

<!-- ✅ LIGHTBOX HTML -->
<div id="lightbox">
  <button onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" />
</div>

<div id="toast"></div>

<script src="/js/shared.js"></script>
<script>
// Initialize theme on load
initTheme();

// Update cart badge
function updateBadge() {
  const badge = document.getElementById('cart-badge');
  const mobileBadge = document.getElementById('mobile-cart-badge');
  if (badge) {
    const count = getCartCount();
    badge.textContent = count;
    badge.style.display = count > 0 ? 'block' : 'none';
  }
  if (mobileBadge) {
    const count = getCartCount();
    mobileBadge.textContent = count;
    mobileBadge.style.display = count > 0 ? 'block' : 'none';
  }
}

// Load and render products
let allProducts = [];
let currentPage = 1;
let currentCategory = '';
let currentSearch = '';
let currentSort = 'newest';
const LIMIT = 12;

async function loadProducts(reset = true) {
  const grid = document.getElementById('products-grid');
  if (reset) grid.innerHTML = skeletonCards(LIMIT);

  try {
    const params = new URLSearchParams({
      page: currentPage,
      limit: 200, // Load more for client-side filtering
      category: currentCategory || undefined,
      search: currentSearch || undefined,
      sort: currentSort
    });

    const data = await apiFetch(`/products?${params}`);
    allProducts = data.data || [];
    renderProducts();
    updateResultCount();
  } catch (err) {
    grid.innerHTML = `<p style="text-align:center;padding:40px;color:var(--midtone)">Failed to load products.</p>`;
  }
}

function renderProducts() {
  const grid = document.getElementById('products-grid');
  grid.innerHTML = allProducts.map(p => `
    <div class="product-card fade-in-up">
      <div class="product-card-img">
        <img src="${p.imageUrl}" alt="${p.name}" loading="lazy"
             onclick="openLightbox('${p.imageUrl}')" />
        <span class="product-badge">${p.category}</span>
        <div class="zoom-hint" style="position:absolute;bottom:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(44,36,22,.65);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.9rem;opacity:0;transform:scale(.8);transition:.2s;pointer-events:none;">🔍</div>

        <!-- Wishlist Button -->
        <button class="wishlist-btn ${isInWishlist(p._id) ? 'active' : ''}"
                data-id="${p._id}"
                onclick="toggleWishlistCard(this, ${JSON.stringify(p).replace(/"/g, '&quot;')})"
                style="position:absolute;top:14px;right:14px;width:36px;height:36px;background:rgba(255,255,255,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--charcoal);cursor:pointer;z-index:2;box-shadow:0 2px 10px rgba(0,0,0,.15);transition:all .3s ease;">
          ${isInWishlist(p._id) ? '❤️' : '🤍'}
        </button>
      </div>

      <div class="product-card-body">
        <p class="product-card-category">${p.category}</p>
        <h3 class="product-card-name">${p.name}</h3>
        <p class="product-card-desc">${p.description}</p>
        <div class="product-card-footer">
          <span class="product-price">${formatPrice(p.price)}</span>
          <button class="btn btn-primary btn-sm" onclick="addToCart(${JSON.stringify(p).replace(/"/g, '&quot;')}, 1)">Add to Cart</button>
        </div>
      </div>
    </div>
  `).join('');

  updateBadge();
}

function toggleWishlistCard(btn, product) {
  const added = toggleWishlist(product);
  btn.textContent = added ? '❤️' : '🤍';
  btn.classList.toggle('active', added);
}

function updateResultCount() {
  const shown = allProducts.length;
  const el = document.getElementById('result-count');
  el.textContent = `Showing ${shown} product${shown !== 1 ? 's' : ''}`;
}

/* Filter buttons */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentCategory = this.getAttribute('data-cat');
    currentPage = 1;
    loadProducts(true);
  });
});

/* Search */
document.getElementById('search-input').addEventListener('input', debounce((e) => {
  currentSearch = e.target.value.trim();
  currentPage = 1;
  loadProducts(true);
}, 500));

/* Sort */
document.getElementById('sort-select').addEventListener('change', (e) => {
  currentSort = e.target.value;
  currentPage = 1;
  loadProducts(true);
});

/* Lightbox (already defined) */
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

/* Mobile nav toggle */
const hamburger = document.querySelector('.nav-hamburger');
if (hamburger) {
  hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('active');
    document.querySelector('.nav-links').classList.toggle('open');
  });
}

// Show mobile nav on small screens
if (window.innerWidth <= 768) {
  const mobileNav = document.querySelector('.mobile-bottom-nav');
  if (mobileNav) mobileNav.style.display = 'flex';
}

// Initial load
loadProducts();
</script>

</body>
</html>
