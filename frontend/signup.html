<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up – Hari</title>

  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>

<div class="auth-page">

  <!-- LEFT SIDE -->
  <div class="auth-art">
    <div class="auth-art-content">
      <div class="auth-art-logo">Hari</div>
      <h2>Join Our <em>World</em> of Craft</h2>
      <p>Create your account and explore amazing ethnic fashion.</p>
    </div>
  </div>

  <!-- RIGHT SIDE FORM -->
  <div class="auth-form-wrap">
    <div class="auth-form-box">

      <h2>Create Account</h2>
      <p class="auth-sub">
        Already have an account? <a href="/login.html">Sign in</a>
      </p>

      <!-- 🔥 IMPORTANT: NO action attribute -->
      <form id="signup-form">

        <!-- NAME -->
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="Your name" required />
        </div>

        <!-- EMAIL -->
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Min 6 characters" required />
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="confirm" placeholder="Re-enter password" required />
        </div>

        <!-- BUTTON -->
        <button type="submit" class="btn btn-primary btn-full">
          Create Account
        </button>

      </form>

      <div style="margin-top:20px;text-align:center;">
        <a href="/">← Back to Home</a>
      </div>

    </div>
  </div>

</div>

<!-- Toast -->
<div id="toast"></div>

<!-- 🔥 THIS IS IMPORTANT -->
<script src="/js/shared.js"></script>
<script>
if (getToken() && getUser()) { window.location.href = '/'; }
initTheme();
</script>

</body>
</html>
