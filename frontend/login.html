<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Hari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="auth-page">
  <!-- ── Decorative Left Panel ────────────────────────────────── -->
  <div class="auth-art">
    <div class="auth-art-content">
      <div class="auth-art-logo">Hari</div>
      <h2>Welcome <em>Back</em> to Elegance</h2>
      <p>Sign in to explore our latest collection of  Kurtis and Suits.</p>
    </div>
  </div>

  <!-- ── Form Panel ─────────────────────────────────────────────── -->
  <div class="auth-form-wrap">
    <div class="auth-form-box fade-in-up">
      <h2>Sign In</h2>
      <p class="auth-sub">
        Don't have an account? <a href="/signup.html">Create one</a>
      </p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email" id="email" name="email"
            placeholder="you@example.com"
            autocomplete="email"
          />
          <p class="field-error" id="email-error"></p>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div style="position:relative;">
            <input
              type="password" id="password" name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              style="padding-right:46px;"
            />
            <button type="button" id="toggle-pass"
              style="position:absolute;right:14px;top:50%;transform:translateY(-50%);
                     background:none;border:none;color:var(--light-txt);font-size:.9rem;cursor:pointer;"
              aria-label="Toggle password visibility">👁</button>
          </div>
          <p class="field-error" id="password-error"></p>
        </div>

        <div style="display:flex;justify-content:flex-end;margin-bottom:24px;">
          <a href="#" style="font-size:.83rem;color:var(--copper);">Forgot password?</a>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-full">
          Sign In
        </button>
      </form>

      <div style="margin-top:24px;text-align:center;">
        <a href="/" style="font-size:.85rem;color:var(--midtone);">← Back to Home</a>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/js/shared.js"></script>
<script>
  if (getToken() && getUser()) {
    window.location.href = '/';
  }

  document.getElementById('toggle-pass').addEventListener('click', () => {
    const input = document.getElementById('password');
    input.type = input.type === 'password' ? 'text' : 'password';
  });

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors();

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    let valid = true;

    if (!email) {
      showFieldError('email', 'Email is required'); valid = false;
    } else if (!/^\S+@\S+\.\S+$/.test(email)) {
      showFieldError('email', 'Enter a valid email'); valid = false;
    }
    if (!password) {
      showFieldError('password', 'Password is required'); valid = false;
    }
    if (!valid) return;

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in…';

    try {
      const data = await apiFetch('/auth/login', {
        method: 'POST',
        body:   { email, password },
      });

      setAuth(data.token, data.user);
      showToast('Welcome back! 👋', 'success');

      setTimeout(() => {
        window.location.href = data.user.role === 'admin' ? '/admin.html' : '/';
      }, 800);

    } catch (err) {
      showToast(err.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });

  function showFieldError(field, msg) {
    document.getElementById(field).classList.add('error');
    document.getElementById(`${field}-error`).textContent = msg;
  }
  function clearErrors() {
    ['email','password'].forEach(f => {
      document.getElementById(f).classList.remove('error');
      document.getElementById(`${f}-error`).textContent = '';
    });
  }
</script>
</body>
</html>
